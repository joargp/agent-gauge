name: Release

on:
  push:
    tags: ["v*"]
  # Run manually with `gh workflow run release.yml --ref <tag>`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    # The signing secrets live in this environment, which only v* tags may use.
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      # Signing and notarization run only when these secrets are configured.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow on a release tag, for example: gh workflow run release.yml --ref v0.2.0" >&2
          exit 1

      - uses: actions/checkout@v4

      - run: swift test

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "AGENT_GAUGE_SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.NOTARY_KEY_P8 != ''
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          export AGENT_GAUGE_VERSION="${TAG#v}"
          export AGENT_GAUGE_BUILD_NUMBER="${{ github.run_number }}"
          ZIP="$(./script/package_release.sh | tail -n 1)"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AgentGauge-${{ env.TAG }}
          path: ${{ env.ZIP }}

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Agent Gauge ${TAG#v}" --generate-notes
          gh release upload "$TAG" "$ZIP" --clobber
